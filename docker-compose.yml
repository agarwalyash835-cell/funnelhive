# docker compose up -d   →   http://localhost:4000
# Deploys with rollback: server/scripts/deploy.sh (builds funnelhive:<version>, keeps the previous one — see DEPLOY.md).
# A plain `docker compose --profile https up -d --build` still works: it builds and runs funnelhive:current.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # logs rotate: at most 5 × 10 MB per container, so they can't fill the disk
    max-file: "5"

services:
  funnelhive:
    build: .
    image: funnelhive:${FH_TAG:-current}
    restart: unless-stopped
    # docker stop / a deploy sends SIGTERM: requests in flight finish and the database is flushed (up to ~10 s)
    stop_grace_period: 20s
    logging: *logging
    ports:
      - "127.0.0.1:4000:4000"   # only via Caddy (HTTPS) from outside; localhost:4000 still works on the server
      - "25:2525"               # the lead inbox: forwarded portal emails for leads-…@INBOUND_EMAIL_DOMAIN (receive only)
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      INBOUND_SMTP_PORT: "2525"
      # APP_URL, ADMIN_EMAILS, WEB_CONCURRENCY etc. come from server/.env
    volumes:
      - funnelhive-data:/data

  # HTTPS for the app and sellers' custom domains (automatic certificates).
  # Start with:  APP_DOMAIN=app.yourbrand.in ACME_EMAIL=you@yourbrand.in docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [funnelhive]
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      PAGES_DOMAIN: ${PAGES_DOMAIN:-pages.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      # a previous app / pages address (after moving domains): browsers are redirected, webhooks and API calls still answered
      OLD_APP_DOMAIN: ${OLD_APP_DOMAIN:-old-app.localhost}
      OLD_PAGES_DOMAIN: ${OLD_PAGES_DOMAIN:-old-pages.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  funnelhive-data:
  caddy-data:
