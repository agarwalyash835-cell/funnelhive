<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07070c" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; connect-src 'self' https://app.getaihive.in; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'" />
  <title>AiHive Academy</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- the living background: three slow colour fields and a film grain -->
  <div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <div class="grain" aria-hidden="true"></div>

  <main id="app"></main>

  <!-- add an academy -->
  <div class="sheet-bg" id="sheetBg" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grip" aria-hidden="true"></div>
    <h2 id="sheetTitle">Add an academy</h2>
    <p class="mute">Paste the link your teacher sent you, or type the academy’s code.</p>
    <form id="addForm" autocomplete="off">
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5M14 10a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5" /></svg>
        <input id="addInput" inputmode="url" spellcheck="false" autocapitalize="none" placeholder="app.getaihive.in/learn/…" aria-label="Academy link or code" />
        <button type="button" class="paste" id="pasteBtn">Paste</button>
      </label>
      <p class="err" id="addErr" role="alert"></p>
      <div class="preview" id="preview" hidden></div>
      <button class="cta" id="addBtn" type="submit"><span>Find academy</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></button>
    </form>
  </section>

  <!-- the card grows into the academy while it loads -->
  <div class="portal" id="portal" aria-hidden="true"><div class="portal-in"><div class="portal-logo" id="portalLogo"></div><b id="portalName"></b><span class="portal-lock"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6l7-3z" /><path d="M9 12l2 2 4-4" /></svg>Protected</span></div></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
